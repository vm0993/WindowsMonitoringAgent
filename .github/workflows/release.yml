name: Build & Release Agent

# Push a tag like v2.0.1 -> builds win-x64 self-contained exe, the zip package and the setup.exe installer,
# and publishes a GitHub Release. Push/PR to main -> build only (kept as workflow artifacts for 14 days).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      package: ${{ steps.ver.outputs.package }}
      file_version: ${{ steps.ver.outputs.file_version }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            FILE_VERSION="${VERSION%%-*}"
          else
            VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"
            FILE_VERSION="0.0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file_version=$FILE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package=OfficeMonitoringAgent-${VERSION}-win-x64" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          dotnet publish WindowsMonitoringAgent.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -warnaserror:NU1901,NU1902,NU1903,NU1904
          -o dist/pkg/publish

      - name: Package
        run: |
          cp -r deploy dist/pkg/deploy
          cp README.md README-V2.md dist/pkg/
          cd dist/pkg
          zip -r "../${{ steps.ver.outputs.package }}.zip" .
          cd ..
          sha256sum "${{ steps.ver.outputs.package }}.zip" > "${{ steps.ver.outputs.package }}.zip.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.package }}
          path: dist/${{ steps.ver.outputs.package }}.zip*
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: dist/pkg/publish
          retention-days: 1

  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.build.outputs.version }}" "/DFileVersion=${{ needs.build.outputs.file_version }}" "/DPublishDir=..\publish" installer\OfficeMonitoringAgent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item "dist\OfficeMonitoringAgent-Setup-*.exe"
          "$((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower())  $($setup.Name)" | Set-Content -NoNewline -Encoding ascii "$($setup.FullName).sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: OfficeMonitoringAgent-Setup-${{ needs.build.outputs.version }}
          path: dist/OfficeMonitoringAgent-Setup-*
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/OfficeMonitoringAgent-Setup-*.exe \
            dist/OfficeMonitoringAgent-Setup-*.exe.sha256 \
            "dist/${{ needs.build.outputs.package }}.zip" \
            "dist/${{ needs.build.outputs.package }}.zip.sha256" \
            --title "Office Monitoring Agent $GITHUB_REF_NAME" \
            --generate-notes
